# The session-messages layer: one insert naming this package. `dsh plugin` adds
# this package to dsh.profile.bundles because it declares dsh.bundle, and the
# patch below is what makes the row a mounted Loader entry.
#
# Every value here is a Config field of src/index.ts — the shortcut is
# deliberately not hardcoded (dsh forbids hardcoded tunables in plugins).
- insert:
    - id: session-messages
      name: 'dsh-session-messages'
      config:
        key: 's'
        ctrl: true
        alt: false
        shift: false
        meta: false
        wheelInverted: false
        maxRows: 50
        showHud: false
